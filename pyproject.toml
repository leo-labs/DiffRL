[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diffrl"
version = "0.1.0"
description = "Differentiable Reinforcement Learning"
requires-python = ">=3.8"

dependencies = [
    "pyyaml==6.0",
    "tensorboard",
    "tensorboardX",
    "urdfpy==0.0.22",
    # deactivated because of version conflicts, probably not needed for our usecase
    #"usd-core==22.3"
]

[tool.setuptools.packages.find]
include = ["algorithms*", "envs*", "models*", "optim*", "utils*"]