[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diffrl"
version = "0.1.0"
description = "Differentiable Reinforcement Learning"
requires-python = ">=3.8"

dependencies = [
    "pyyaml==6.0",
    "tensorboard==2.8.0",
    "tensorboardX==2.5",
    "urdfpy==0.0.22",
    "usd-core==22.3",
    "protobuf==3.20.0",
]

[tool.setuptools.packages.find]
include = ["algorithms*", "envs*", "models*", "optim*", "utils*"]